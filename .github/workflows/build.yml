name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      links:
        description: "Space-separated Spotify track links to run through the detector"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Detector + parser unit tests
        run: ./gradlew :core:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-report
          path: core/build/reports/tests/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ai-song-checker-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  # MediaCodec decoding + detector on a real Android runtime.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

  # Runs the on-device pipeline (with ffmpeg standing in for MediaCodec) on real
  # Spotify previews, proving the embed scraping still works end to end.
  spotify-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Analyse Spotify previews
        env:
          LINKS: ${{ github.event.inputs.links }}
          # Ad-hoc links from "Run workflow" are only reported, not asserted.
          EXPECT: ${{ github.event.inputs.links && '--report' || '--expect-human' }}
        run: |
          if [ -z "$LINKS" ]; then
            # Well-known human-made recordings: expected to score low.
            LINKS="https://open.spotify.com/track/4PTG3Z6ehGkBFwjybzWkR8 https://open.spotify.com/track/003vvx7Niy0yvhvHt4a68B https://open.spotify.com/track/0VjIjW4GlUZAMYd2vXMi3b https://open.spotify.com/track/7qiZfU4dY1lWllzX7mPBI3"
          fi
          ./gradlew -q :core:run --args="${EXPECT:---expect-human} $LINKS"
      # Positive controls: AI songs (Suno + Udio) from the SONICS dataset, checked as-is and as a
      # 30 s 96 kbps re-encode that mimics a Spotify preview. SONICS was part of the upstream
      # model's training data, so this guards the pipeline, not the model's generalisation.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyse known AI songs (SONICS)
        run: |
          pip install -q remotezip
          if ! python tools/ci/fetch_sonics_samples.py ai 6; then
            echo "::warning::SONICS unreachable; AI positive controls skipped"; exit 0
          fi
          for f in ai/*; do
            ffmpeg -v error -ss 20 -t 30 -i "$f" -ar 44100 -b:a 96k "ai/preview-$(basename "${f%.*}").mp3"
          done
          # Full-length AI songs must score at least Possibly AI; preview-quality re-encodes are reported only
          # (Udio's fingerprint in particular fades at 96 kbps / 30 s).
          full=$(ls "$PWD"/ai/fake_* | tr '\n' ' ')
          previews=$(ls "$PWD"/ai/preview-* | tr '\n' ' ')
          ./gradlew -q :core:run --args="--expect-ai $full --report $previews"
